name: Set up
description: Install pnpm, Node from .nvmrc and the workspace dependencies.
inputs:
  cache:
    description: Restore and save the pnpm store cache. The release workflow turns it off so a poisoned cache can't reach what it publishes.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - run: pnpm install --frozen-lockfile
      shell: bash
