name: Ref test (temporary)
on:
  push:
    branches: [claude/project-thread-ybj6vd]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/zz-ref-test -f sha=fd5b436de6b4768d7e668bad48d7bffb32af3e6e --jq .object.sha || echo CREATE_FAILED
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/zz-ref-test" -f sha=356cbbb2b44916d5ad88c2a6082859bff3835afc -F force=false --jq .object.sha && echo PATCH_OK || echo PATCH_FAILED
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/zz-ref-test" && echo DELETED || echo DELETE_FAILED
