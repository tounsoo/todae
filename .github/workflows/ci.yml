name: CI

on:
  push:
    branches: [main]
    # A push whose every file is markdown never starts a job. Docs pages are MDX, so they still run.
    paths-ignore:
      - '**.md'
  # Drafts skip CI; marking one ready for review runs it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Package checks share one runner, so setup and the package build happen once and
# GitHub's per-job minute applies once. The docs job stays in its own container.
jobs:
  checks:
    if: ${{ !github.event.pull_request.draft }}
    name: Checks
    # Playwright 1.56 can't install Chromium on ubuntu-latest's 26.04 image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset check compares the pull request with its base branch.
          fetch-depth: 0

      - id: change
        name: Classify the diff
        run: |
          set -euo pipefail
          bash .github/scripts/change-class.sh --self-test
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            diff_args=("$base...$head")
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            diff_args=("$base" "$head")
          fi
          # A missing commit (a new history, or a checkout that does not have it) runs every check.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "class=all" >> "$GITHUB_OUTPUT"
            echo "class=all (commits not in the checkout)"
            exit 0
          fi
          paths=()
          while IFS=$'\t' read -r status old new; do
            [ -z "${status:-}" ] && continue
            case "$status" in
              R*|C*) paths+=("$old" "$new") ;;
              *) paths+=("$old") ;;
            esac
          done < <(git -c core.quotePath=false diff --name-status --find-renames "${diff_args[@]}")
          if [ "${#paths[@]}" -eq 0 ]; then
            class=all
          else
            class=$(printf '%s\n' "${paths[@]}" | bash .github/scripts/change-class.sh)
          fi
          echo "class=$class" >> "$GITHUB_OUTPUT"
          echo "class=$class files=${#paths[@]}"
          if [ "$class" = prose ]; then
            printf '%s\n' "${paths[@]}"
          fi

      - uses: ./.github/actions/setup

      # Fails when the package changed outside its tests and no changeset was added.
      # The Version Packages pull request deletes the changesets, so it skips the check.
      - if: ${{ steps.change.outputs.class == 'all' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') }}
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      - if: steps.change.outputs.class == 'all'
        run: pnpm tokens:check
      - if: steps.change.outputs.class == 'all'
        run: pnpm schema && git diff --exit-code -- packages/design-system/schema/components.json
      - if: steps.change.outputs.class == 'all'
        run: pnpm typecheck
      - if: steps.change.outputs.class == 'all'
        run: pnpm lint

      # The docs tests import the package from dist. Unit tests run for page prose too.
      - run: pnpm build:ds
      - run: pnpm test

      # Keyed on the lockfile, which pins Playwright and so its Chromium build.
      - if: steps.change.outputs.class == 'all'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.change.outputs.class == 'all' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tounsoo/todae exec playwright install --with-deps chromium
      - if: steps.change.outputs.class == 'all' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tounsoo/todae exec playwright install-deps chromium
      # Some docs demos import the package's subpath entries, which only exist in dist.
      - if: steps.change.outputs.class == 'all'
        run: pnpm test:browser

      # The first install ran before dist existed, so it couldn't link the todae-tokens bin.
      - if: steps.change.outputs.class == 'all'
        run: pnpm install --frozen-lockfile --offline
      - if: steps.change.outputs.class == 'all'
        name: Second-brand example
        run: pnpm --filter fernway-example build

  docs:
    if: ${{ !github.event.pull_request.draft }}
    name: Docs build and screenshots
    runs-on: ubuntu-latest
    # Screenshot baselines are taken in this image, so fonts and Chromium match. Its version is
    # @playwright/test's in apps/docs, which apps/docs/visual/image.test.ts checks.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: apps/docs/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**', 'packages/design-system/src/**', '!**/node_modules/**', '!apps/docs/.next/**', '!apps/docs/visual/**') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build:ds
      - run: pnpm --filter docs build
      - run: pnpm --filter docs test:visual
      # The report shows each changed shot; test-results holds its new image as `<name>-actual.png`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          retention-days: 7
