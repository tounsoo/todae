name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm schema && git diff --exit-code -- packages/design-system/schema/components.json
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Build @omsoo/todae
        run: pnpm --filter @omsoo/todae build
      - name: Test
        run: pnpm test
      - name: Install Chromium for browser tests
        run: pnpm --filter @omsoo/todae exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser
      - run: pnpm build
