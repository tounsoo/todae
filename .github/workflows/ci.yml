name: CI

# Checkout reads the repo. Cache and artifact upload use the run's own tokens, not this one.
permissions:
  contents: read

# Every push and pull request runs, so Checks always reports and release.yml can wait for it. A change
# that is only Markdown no tool reads runs Changes, Forbidden paths and Checks, and skips the rest;
# .github/scripts/change-class.sh decides which files those are. Drafts run Changes, Check, Token API,
# Token consumers and Forbidden paths, and Checks fails until the pull request is ready.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One classification of the diff for every job: all, prose (docs pages only) or markdown.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      class: ${{ steps.change.outputs.class }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs the push's or the pull request's base commit.
          fetch-depth: 0
      - id: change
        name: Classify the diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: bash .github/scripts/classify-diff.sh

  static:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.class != 'markdown' }}
    name: Static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changeset check compares the pull request with its base branch.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Fails when the package changed outside its tests and no changeset was added. A change to only the
      # package's test-only devDependencies (listed in changeset-exempt.mjs), as in a Dependabot update of Vitest,
      # ships nothing and passes without one.
      # The Version Packages pull request deletes the changesets, so it skips the check. Only the release
      # app's branch in this repository counts as that pull request, not a fork's branch of the same name.
      - name: Changeset
        if: ${{ needs.changes.outputs.class == 'all' && github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/changeset-exempt.mjs "origin/$BASE_REF" || pnpm changeset status --since="origin/$BASE_REF"
      - name: Tokens
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' }}
        run: pnpm tokens:check
      - name: Schema
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' }}
        run: pnpm schema && git diff --exit-code -- packages/design-system/schema/components.json
      - name: Check
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' }}
        run: pnpm check
      # Every remote action is pinned to a commit. Dependabot (.github/dependabot.yml) moves the pins.
      - name: Pinned actions
        if: ${{ !cancelled() }}
        run: node .github/scripts/pinned-actions.mjs

  build:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.class != 'markdown' }}
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build the package
        id: package-build
        if: ${{ !cancelled() }}
        run: pnpm build:ds
      # Fernway restores this copy. A failed save does not fail the job, because a miss makes Fernway build dist itself.
      - name: Share the package build
        if: ${{ steps.package-build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/design-system/dist
          key: ds-dist-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish checks
        if: ${{ !cancelled() }}
        run: pnpm publish:check
      - name: SSR smoke
        if: ${{ !cancelled() }}
        run: pnpm ssr:smoke
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

  # Chromium runs in the same Playwright image as the Engines jobs, so it installs nothing from Ubuntu's mirror.
  fernway:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.class != 'markdown' }}
    name: Fernway
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # The image's sans-serif is WenQuanYi Zen Hei, which has no bold face, so bold text would measure
      # as wide as regular. Liberation Sans, already in the image, has one, as every real system font does.
      - &bold-sans-serif
        name: Use a sans-serif with a bold face
        run: |
          cat > /etc/fonts/local.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="same">
              <family>sans-serif</family>
              <prefer><family>Liberation Sans</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-match sans-serif:bold

      - name: Restore the package build
        id: package-dist
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/design-system/dist
          key: ds-dist-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build the package
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' && steps.package-dist.outputs.cache-hit != 'true' }}
        run: pnpm build:ds
      # Firefox and WebKit run the package's browser tests in the Engines jobs.
      - name: Browser tests
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' }}
        run: pnpm test:browser --project chromium

      # The first install ran before dist existed, so it couldn't link the todae-tokens bin.
      - if: ${{ !cancelled() && needs.changes.outputs.class == 'all' }}
        run: pnpm install --frozen-lockfile --offline
      - if: ${{ !cancelled() && needs.changes.outputs.class == 'all' }}
        name: Second-brand example
        run: pnpm --filter fernway-example build

  # The package's browser tests in the other engines README's browser floors name, beside Fernway's Chromium run.
  # Both run in the image the Docs build and pages and Fernway jobs use, with the browsers and every system package they need already in
  # it. Installing those packages on the runner pulls them from Ubuntu's mirror on every run, and when that
  # mirror slowed down the install outlasted the job's timeout: WebKit's 114 MB first, then Firefox's on Nov 6.
  # apps/docs/test/image.test.ts checks that this image, Fernway's and the Docs build and pages job's are the same, with the pinned
  # Playwright version and a digest. A Playwright bump changes the tag and the digest here, in Fernway and in the Docs build and pages job,
  # with docker buildx imagetools inspect giving the digest.
  engines:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.class != 'markdown' }}
    name: Engines (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - *bold-sans-serif

      # Firefox runs every test page in one content process, where pages that run at once take each
      # other's clicks, so it runs one file at a time.
      # Tests on the Firefox quarantine (packages/design-system/scripts/firefox-quarantine.ts, issue 367)
      # still run, but their failures warn instead of failing the job. Any other failure still fails it,
      # and the job summary lists each quarantined test's result. By 1.0 the quarantine must be empty and
      # Firefox fully blocking again.
      - name: Browser tests
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' && matrix.browser == 'firefox' }}
        working-directory: packages/design-system
        env:
          # Firefox refuses to launch as root when HOME is owned by another user.
          HOME: /root
        # The runner context names the host's temp folder, which the container sees as RUNNER_TEMP.
        run: |
          export BROWSER_RESULTS="$RUNNER_TEMP/firefox-results.json"
          set +e
          pnpm test:browser --project firefox --no-file-parallelism --reporter=default --reporter=./scripts/browser-results-reporter.ts
          status=$?
          set -e
          node --experimental-strip-types --no-warnings=ExperimentalWarning scripts/firefox-quarantine.ts --results "$BROWSER_RESULTS" --vitest-exit "$status" --summary "$GITHUB_STEP_SUMMARY"

      - name: Browser tests
        if: ${{ !cancelled() && needs.changes.outputs.class == 'all' && matrix.browser == 'webkit' }}
        run: pnpm --filter @tounsoo/todae test:browser --project webkit

  # One result named Checks that covers every blocking job, so branch protection can require that name alone,
  # and release.yml waits for it before publishing. Token consumers is informational and Check only runs on
  # drafts, so neither is here. A job may be skipped only where this workflow skips it on purpose: every job
  # but Changes and Forbidden paths on a Markdown-only change, and Token API on a push. On a draft, Checks
  # fails instead of reporting skipped, which a required check would count as passing.
  checks:
    name: Checks
    needs: [changes, static, build, fernway, engines, docs, token-api, forbidden-paths]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          NEEDS: ${{ toJSON(needs) }}
          CLASS: ${{ needs.changes.outputs.class }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          if [ "$DRAFT" = true ]; then
            echo "::error::This pull request is a draft, so Checks didn't run. Mark it ready for review to run them."
            exit 1
          fi
          printf '%s\n' "$NEEDS" | jq -e --arg class "$CLASS" --arg event "$EVENT_NAME" '
            to_entries | all(
              .value.result == "success"
              or (.value.result == "skipped" and (
                ($class == "markdown" and (.key | IN("changes", "forbidden-paths") | not))
                or (.key == "token-api" and $event != "pull_request")
              ))
            )' >/dev/null

  # Checks fails on drafts. This job still runs, as Token API does, so a lint or type error fails before review.
  check:
    name: Check
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && needs.changes.outputs.class != 'markdown' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint and types
        run: pnpm check

  # Checks fails on drafts. This job still runs so a removed, renamed, or retyped token path fails before review.
  # The prose-only skip does not apply. This job is the only token API gate, so a docs-only pull request still runs it.
  token-api:
    name: Token API
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.class != 'markdown' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Snapshot matches the build
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm --filter @tounsoo/todae tokens:check --base "$BASE"
      - name: No public token was removed, renamed or retyped
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm --filter @tounsoo/todae exec node --experimental-strip-types --no-warnings=ExperimentalWarning scripts/check-token-api.ts --base "$BASE" --head "$HEAD"

  # Informational. Lists components that read a changed token. Never fails the build.
  token-consumers:
    name: Token consumers
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.class != 'markdown' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Report
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm --filter @tounsoo/todae exec node --experimental-strip-types --no-warnings=ExperimentalWarning scripts/token-consumers.ts --base "$BASE" --head "$HEAD" --summary "$GITHUB_STEP_SUMMARY"

  # Checks fails on drafts. This job still runs, as Token API does, so a scratch file fails before review.
  # It runs on Markdown-only changes too, since a *-body.md or .audit/ file is what it looks for.
  forbidden-paths:
    name: Forbidden paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No forbidden paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/forbidden-paths.sh --self-test
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
            diff_args=("$base...$head")
          else
            base="$PUSH_BEFORE"
            head="$PUSH_SHA"
            diff_args=("$base" "$head")
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "forbidden-paths: skipped because this push has no base commit"
            exit 0
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "forbidden-paths: could not read the base or head commit"
            exit 1
          fi
          # -z keeps a quote, tab, or newline in the path. --no-renames lists the new path of a rename.
          # Do not store this output in a variable. Bash drops bytes at the first NUL.
          git -c core.quotePath=false diff -z --name-status --diff-filter=AMT --no-renames "${diff_args[@]}" | bash .github/scripts/forbidden-paths.sh
      # Threads read the pinned pstack copy, so a change that breaks it or a todae playbook's anchor in it
      # fails here, on every class of change. It reads text only.
      - name: Pinned pstack copy
        run: sh .agents/pstack/check.sh

  docs:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.class != 'markdown' }}
    name: Docs build and pages
    runs-on: ubuntu-24.04
    # Playwright's image brings the browsers its own version fits. Its version is @playwright/test's
    # in apps/docs, which apps/docs/test/image.test.ts checks. The digest keeps a re-pushed tag out.
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build:ds
      - run: pnpm --filter docs build
      - run: pnpm --filter docs test:axe
      # Firefox refuses to launch as root when HOME is owned by another user.
      - run: pnpm --filter docs test:peek
        env:
          HOME: /root
