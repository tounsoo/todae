name: Docs deploy

# Builds the docs site on GitHub's runners and hands Vercel the finished output, so Vercel runs no build.
# Pull requests and main get preview deployments; docs-stable, which only release.yml moves, deploys to
# production. Without the VERCEL_TOKEN secret, and on pull requests from forks, which get no secrets, the
# Gate job explains why and the deploy is skipped, not failed.
#
# The token never shares a job with the repository's code. Settings and Deploy hold it and run only the
# Vercel CLI from npm, with no checkout. Build runs the install and the build, which run every dependency's
# code, with no token: code there could write to $GITHUB_ENV or replace a binary for later steps of its job.
permissions:
  contents: read

on:
  # Drafts get a preview too. ready_for_review is left out because it changes no code.
  pull_request:
    types: [opened, synchronize, reopened]
    # The same paths as ci.yml: a markdown-only change starts no job.
    paths:
      - '**'
      - '!**.md'
      - '.changeset/**'
      - 'packages/design-system/README.md'
      - 'packages/design-system/CHANGELOG.md'
      - '*-body.md'
      - '**/*-body.md'
      - '.audit/**'
  push:
    branches: [main, docs-stable]
  # Redeploys a branch by hand. Run on docs-stable, it deploys production.
  workflow_dispatch:

# A new push to a pull request cancels its older deploy. On main and docs-stable a running deploy finishes, and
# GitHub drops a waiting one when a newer one queues, so the newest commit always deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # An exact version, so a new CLI release can't change a deploy. Dependabot doesn't move it: bump it by hand.
  VERCEL_CLI_VERSION: 65.2.0
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      target: ${{ steps.gate.outputs.target }}
    steps:
      - id: gate
        name: Decide whether to deploy
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice title=No docs deploy::$1"
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT_NAME" = pull_request ]; then
            # GitHub gives a fork's pull request no secrets, and its code must never meet the token.
            [ "$HEAD_REPO" = "$REPOSITORY" ] || skip "Pull requests from forks get no preview. Push the branch to this repository to get one."
            # Bench record pull requests only add a JSON record, as vercel.json's ignoreCommand once skipped them.
            case "$HEAD_REF" in
              bench-record/*|changesets-ghcommit-temp/*) skip "Branch $HEAD_REF gets no docs preview." ;;
            esac
          fi
          [ "$HAS_TOKEN" = true ] || skip "The VERCEL_TOKEN repository secret isn't set, so nothing was deployed. CONTRIBUTING.md (Deploy the docs) says how to add it."
          if [ "$REF" = refs/heads/docs-stable ] && [ "$EVENT_NAME" != pull_request ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  # Reads the project's settings and production domain. Holds the token; runs no repository code.
  settings:
    name: Settings
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      settings: ${{ steps.pull.outputs.settings }}
      host: ${{ steps.pull.outputs.host }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # In its own step, without the token, and with no install scripts: npm resolves the CLI's dependencies
      # without a lockfile, so their scripts mustn't run where the token is.
      - name: Install the Vercel CLI
        run: npm install --global --ignore-scripts "vercel@$VERCEL_CLI_VERSION"
      - id: pull
        name: Pull the project settings
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ needs.gate.outputs.target }}
          # The ids aren't secret (.cursor/skills/verify/SKILL.md names both), so they work as secrets or as
          # repository variables of these names, and fall back to the ids that file names.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_8iiNJ83cVoixqY1F3xzd566X' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_EUJCIhRJSkC2BYTOnw5Blfu153Zm' }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          # Only the settings leave this job. The pulled environment file can hold tokens and stays here. The
          # ids stay too: GitHub drops a job output that holds a secret's value, so ids set as secrets would
          # blank it.
          echo "settings=$(jq -c .settings .vercel/project.json)" >> "$GITHUB_OUTPUT"
          # next.config.mjs points canonical and link preview URLs at this host. If the pulled settings
          # don't name it, the docs' production domain stands in.
          host=$({ sed -n 's/^VERCEL_PROJECT_PRODUCTION_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' ".vercel/.env.$TARGET.local" 2>/dev/null || true; } | head -n 1)
          if ! [[ $host =~ ^[a-z0-9.-]+$ ]]; then
            echo "::notice::The pulled settings name no production domain, so the build uses todae.omsoo.design."
            host=todae.omsoo.design
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"

  # Runs the install and the build, with no token.
  build:
    name: Build
    needs: [gate, settings]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET: ${{ needs.gate.outputs.target }}
      HOST: ${{ needs.settings.outputs.host }}
      VERCEL_PROJECT_PRODUCTION_URL: ${{ needs.settings.outputs.host }}
    steps:
      # The pull request's head, not the merge commit checkout picks by default, so the deployment's
      # githubCommitSha is the head the verify skills compare it with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Next's webpack cache is about 800 MB and cuts the compile from about 60 s to about 35 s. Only main
      # saves it, once per lockfile, so it can't crowd CI's caches out of the repository's 10 GB; other
      # runs restore that copy. A stale copy is still safe, since webpack checks each module's hash.
      - name: Restore the Next build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: docs-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --standalone copies every file a function reads into the output, so Deploy needs no checkout.
      - name: Build
        env:
          SETTINGS: ${{ needs.settings.outputs.settings }}
          # The build only names the project. Deploy sends the ids that count.
          ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_8iiNJ83cVoixqY1F3xzd566X' }}
          PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_EUJCIhRJSkC2BYTOnw5Blfu153Zm' }}
        run: |
          set -euo pipefail
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          mkdir -p .vercel
          jq -n --arg org "$ORG_ID" --arg project "$PROJECT_ID" --argjson settings "$SETTINGS" \
            '{projectId: $project, orgId: $org, settings: $settings}' > .vercel/project.json
          if [ "$TARGET" = production ]; then
            vercel build --prod --standalone
          else
            vercel build --standalone
          fi

      # The host is a build-time constant that next.config.mjs inlines into the pages and the functions
      # alike, so pages that name it show the functions do too. robots.txt and sitemap.xml name it as well.
      - name: Pages name the production site
        run: |
          set -euo pipefail
          [ -d .vercel/output ] || { echo "::error::The build wrote no .vercel/output folder."; exit 1; }
          pages=$({ grep -rl --include='*.html' "href=\"https://$HOST/" .vercel/output || true; } | wc -l)
          if [ "$pages" -eq 0 ]; then
            echo "::error::No page links to https://$HOST/."
            exit 1
          fi
          if grep -rl --include='*.html' --include='*.xml' --include='*.txt' --include='*.body' 'http://localhost:3000' .vercel/output; then
            echo "::error::These files link to http://localhost:3000, so the build had no production host."
            exit 1
          fi
          echo "$pages pages link to https://$HOST/."

      - name: Save the Next build cache
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: docs-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # One tar file keeps the output's relative symlinks and uploads faster than thousands of files.
      - run: tar -cf "$RUNNER_TEMP/docs-output.tar" .vercel/output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-output
          path: ${{ runner.temp }}/docs-output.tar
          retention-days: 1
          if-no-files-found: error

  # Uploads the built output. Holds the token; runs only the Vercel CLI, with no checkout.
  deploy:
    name: Deploy
    needs: [gate, settings, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      # The ids aren't secret (.cursor/skills/verify/SKILL.md names both), so they work as secrets or as
      # repository variables of these names, and fall back to the ids that file names.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_8iiNJ83cVoixqY1F3xzd566X' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_EUJCIhRJSkC2BYTOnw5Blfu153Zm' }}
      TARGET: ${{ needs.gate.outputs.target }}
      ROOT_DIR: ${{ fromJSON(needs.settings.outputs.settings).rootDirectory }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-output
          path: ${{ runner.temp }}
      # The output came from a job that ran the repository's code. A link out of it, such as one to
      # /proc/self/environ, would upload that file with the deployment, so only files, folders and links
      # that stay inside it pass.
      - name: Unpack the output
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir site
          tar -xf docs-output.tar -C site --no-same-owner --no-same-permissions
          [ -d site/.vercel/output ] && [ ! -L site/.vercel ] && [ ! -L site/.vercel/output ] || { echo "::error::The artifact has no .vercel/output folder."; exit 1; }
          # Deploy runs the CLI in site, so nothing but the output may sit there for it to read.
          if [ "$(ls -A site)" != .vercel ] || [ "$(ls -A site/.vercel)" != output ]; then
            echo "::error::The artifact holds more than .vercel/output."; exit 1
          fi
          root=$(realpath site/.vercel/output)
          odd=$(find site ! -type f ! -type d ! -type l | head -n 5)
          if [ -n "$odd" ]; then
            printf '::error::The output holds something other than files, folders and links:\n%s\n' "$odd"
            exit 1
          fi
          while IFS= read -r -d '' link; do
            target=$(realpath -m "$link")
            case "$target" in
              "$root"/*) ;;
              *) echo "::error::$link points outside the output."; exit 1 ;;
            esac
          done < <(find site -type l -print0)
          # The CLI stops unless the project's Root Directory exists where it runs, though a prebuilt
          # deploy reads nothing from it. An empty one does.
          if [ -n "$ROOT_DIR" ]; then
            [[ $ROOT_DIR =~ ^[A-Za-z0-9._/-]+$ && $ROOT_DIR != *..* && $ROOT_DIR != /* ]] || { echo "::error::The Root Directory setting isn't a plain relative path."; exit 1; }
            mkdir -p "site/$ROOT_DIR"
          fi
      - name: Install the Vercel CLI
        run: npm install --global --ignore-scripts "vercel@$VERCEL_CLI_VERSION"
      - id: deploy
        name: Deploy the prebuilt output
        working-directory: ${{ runner.temp }}/site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # --archive=tgz uploads the output as one gzipped tarball of about 26 MB, not file by file. Vercel caps the
        # files a team uploads in a rolling day at 40,000 on this plan. A build holds about 3,000 distinct files,
        # and Next stamps a new build id into every prerendered page, so even a rebuild of the same commit changes
        # over 1,100 of them and Vercel's per-file cache can't skip them. A busy day of previews used up the cap.
        run: |
          set -euo pipefail
          args=(deploy --prebuilt --archive=tgz --yes --token="$VERCEL_TOKEN" --meta "githubCommitSha=$SHA" --meta "githubCommitRef=$BRANCH")
          [ "$TARGET" = production ] && args+=(--prod)
          out=$(vercel "${args[@]}")
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error::The deploy printed no deployment URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Docs %s deployment for %s: %s\n' "$TARGET" "$SHA" "$url" >> "$GITHUB_STEP_SUMMARY"

  # Its own job, with no checkout, so the pull request write permission never meets the pull request's code.
  comment:
    name: Preview comment
    needs: deploy
    if: ${{ github.event_name == 'pull_request' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ needs.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $URL =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || { echo "::error::Unexpected deployment URL"; exit 1; }
          marker='<!-- todae-docs-preview -->'
          body=$(printf '%s\nDocs preview for %s: %s\n\nVercel asks you to sign in to open it.' "$marker" "$SHA" "$URL")
          id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$id" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPOSITORY/issues/$PR/comments" -f body="$body" --silent
          fi
