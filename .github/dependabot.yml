# Keeps the commit-pinned actions in .github/workflows and .github/actions current.
# Dependabot moves each SHA and its version comment together. One grouped pull request a month
# keeps Vercel preview builds and CI runs down. Actions that only release.yml uses first run on main,
# so check those bumps in the pull request before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
